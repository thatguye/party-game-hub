<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Party Game Hub maskable festive icon">
  <defs>
    <radialGradient id="hub-m-bg" cx="50%" cy="42%" r="76%">
      <stop offset="0%" stop-color="#241652" />
      <stop offset="54%" stop-color="#110C26" />
      <stop offset="100%" stop-color="#070611" />
    </radialGradient>
    <radialGradient id="hub-m-pink" cx="60%" cy="38%" r="44%">
      <stop offset="0%" stop-color="#FF2EF5" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#A855F7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hub-m-cyan" cx="38%" cy="64%" r="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="m-popper-body" x1="16%" y1="86%" x2="72%" y2="30%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="48%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="m-popper-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <radialGradient id="m-mouth-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#F43F5E" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#2E1065" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="m-star-gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="m-ribbon-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>
    <linearGradient id="m-ribbon-pink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <filter id="m-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#05030C" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#hub-m-bg)" />
  <rect width="512" height="512" fill="url(#hub-m-pink)" />
  <rect width="512" height="512" fill="url(#hub-m-cyan)" />

  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <circle cx="256" cy="256" r="204" fill="none" stroke="#A855F7" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="10 14" />

    <g fill="none" stroke-linecap="round" filter="url(#m-glow)">
      <path d="M 244 226 C 232 162, 266 130, 240 84" stroke="url(#m-ribbon-cyan)" stroke-width="15" />
      <path d="M 278 244 C 338 202, 366 232, 424 186" stroke="url(#m-ribbon-pink)" stroke-width="15" />
      <path d="M 284 274 C 344 290, 368 272, 428 308" stroke="#C8FF00" stroke-width="13" />
    </g>

    <g filter="url(#m-shadow)">
      <path d="M 107 411 Q 94 419 102 404 L 210 224 L 288 302 Z" fill="url(#m-popper-body)" />
      <path d="M 164 298 L 216 348 L 194 362 L 150 318 Z" fill="#FDE047" fill-opacity="0.94" />
      <path d="M 129 351 L 164 382 L 146 393 L 118 368 Z" fill="#22D3EE" fill-opacity="0.92" />
      <path d="M 116 392 L 208 242" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="8" stroke-linecap="round" />

      <ellipse
        cx="249"
        cy="263"
        rx="55"
        ry="20"
        transform="rotate(45 249 263)"
        fill="url(#m-mouth-glow)"
        stroke="url(#m-popper-rim)"
        stroke-width="10"
      />
    </g>

    <g filter="url(#m-glow)">
      <path
        d="M 332 94 L 348 134 L 391 138 L 358 166 L 368 208 L 332 185 L 296 208 L 306 166 L 273 138 L 316 134 Z"
        fill="url(#m-star-gold)"
        stroke="#FFFBEB"
        stroke-width="4"
        stroke-linejoin="round"
      />
      <path d="M 164 114 L 173 139 L 198 148 L 173 157 L 164 182 L 155 157 L 130 148 L 155 139 Z" fill="#00F0FF" />
      <path d="M 382 332 L 389 351 L 408 358 L 389 365 L 382 384 L 375 365 L 356 358 L 375 351 Z" fill="#C8FF00" />
      <path d="M 418 112 L 423 126 L 437 131 L 423 136 L 418 150 L 413 136 L 399 131 L 413 126 Z" fill="#FF2EF5" />
    </g>

    <g>
      <rect x="200" y="122" width="22" height="10" rx="5" transform="rotate(-34 211 127)" fill="#FF2EF5" />
      <rect x="282" y="84" width="20" height="10" rx="5" transform="rotate(24 292 89)" fill="#C8FF00" />
      <rect x="386" y="232" width="24" height="10" rx="5" transform="rotate(-18 398 237)" fill="#38BDF8" />
      <rect x="316" y="346" width="22" height="10" rx="5" transform="rotate(38 327 351)" fill="#FB7185" />
      <circle cx="132" cy="212" r="10" fill="#FDE047" />
      <circle cx="294" cy="240" r="8" fill="#FFFBEB" />
      <circle cx="426" cy="252" r="9" fill="#FDE047" />
      <circle cx="256" cy="396" r="10" fill="#00F0FF" />
      <polygon points="184,196 196,184 208,196 196,208" fill="#C8FF00" />
      <polygon points="348,266 360,254 372,266 360,278" fill="#FF2EF5" />
    </g>
  </g>
</svg>
